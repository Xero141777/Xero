<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Webpage</title>
    <style>
        body {
            background-color: rgb(125, 116, 116);
            color: rgb(5, 75, 36);
            font-size: 18px;
            font-family: Arial, sans-serif;
            margin: 24px;
        }
        h1 {
            color: darkred;
            font-size: 32px;
            margin-bottom: 16px;
        }
        h2 {
            margin-top: 24px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border: 2px solid darkblue;
            border-radius: 8px;
        }
        .contact-form {
            max-width: 420px;
            padding: 24px;
            border: 1px solid #c5ccc7;
            border-radius: 12px;
            background: #f7f7f5;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .contact-form .form-field + .form-field {
            margin-top: 16px;
        }
        .contact-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #9fa9a2;
            border-radius: 6px;
            font: inherit;
        }
        .contact-form textarea {
            min-height: 120px;
            resize: vertical;
        }
        .contact-form :focus-visible {
            outline: 3px solid rgba(5, 75, 36, 0.25);
            border-color: #054b24;
        }
        .contact-form button {
            margin-top: 18px;
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            background: #054b24;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        .contact-form button:hover {
            background: darkred;
        }
        a {
            color: darkred;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Webpage!</h1>

    <h2>About Me</h2>
    <p>
        Hello! My name is Cailem.<br>
        I am a Grade 9 student.<br>
        I enjoy learning new things.
    </p>

    <h2>My Favorite Song</h2>
    <a href="https://youtu.be/kTHNpusq654?list=RDkTHNpusq654" target="_blank" rel="noopener noreferrer">Listen to Hot n Cold by Katy Perry</a>

    <h2>My Hobbies</h2>
    <ul>
        <li>Cubing, walking</li>
        <li>Watching and reading</li>
        <li>Listening to music</li>
    </ul>

    <h2>My Favorite Interest</h2>
    <img src="https://i.pinimg.com/736x/83/46/15/83461550951eac0cf0412680e3e4da74.jpg" alt="My favorite interest" width="250">

    <h2>Contact Me</h2>
    <form class="contact-form" action="#" method="post" aria-label="Contact form">
        <div class="form-field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
