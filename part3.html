<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Webpage</title>
    <style>
        body {
            background-color: #07140c;
            color: #d9f3df;
            font-size: 18px;
            font-family: Arial, sans-serif;
            margin: 24px;
        }
        h1 {
            color: #66d98a;
            font-size: 32px;
            margin-bottom: 16px;
            text-align: center;
        }
        h2 {
            color: #66d98a;
            margin-top: 24px;
        }
        hr {
            border-color: #285c38;
        }
        p {
            color: #c4e6cc;
        }
        .card {
            background-color: #0a1c10;
            border: 1px solid #245c35;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        .info-item + .info-item {
            margin-top: 12px;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border: 2px solid #39734b;
            border-radius: 8px;
        }
        .contact-form {
            max-width: 420px;
            padding: 24px;
            border: 1px solid #245c35;
            border-radius: 12px;
            background: #0d2113;
        }
        .contact-form .form-field + .form-field {
            margin-top: 16px;
        }
        .contact-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #39734b;
            border-radius: 6px;
            font: inherit;
            background: #102819;
            color: #d9f3df;
        }
        .contact-form textarea {
            min-height: 120px;
            resize: vertical;
        }
        .contact-form :focus-visible {
            outline: 3px solid rgba(102, 217, 138, 0.35);
            border-color: #66d98a;
        }
        .contact-form button {
            margin-top: 18px;
            padding: 11px 18px;
            border: 0;
            border-radius: 6px;
            background: #39734b;
            color: #07140c;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        .contact-form button:hover {
            background: #66d98a;
        }
        a {
            color: #8be6a5;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Webpage!</h1>
    <hr>

    <div class="card">
        <h2>About Me</h2>
        <p><strong>Name:</strong> Cailem</p>
        <p><strong>Grade:</strong> Grade 9</p>
        <p><strong>Enjoys:</strong> Learning new things</p>
    </div>

    <div class="card">
        <h2>My Favorite Song</h2>
        <p><a href="https://youtu.be/kTHNpusq654?list=RDkTHNpusq654" target="_blank" rel="noopener noreferrer">Hot n Cold by Katy Perry</a></p>
    </div>

    <div class="card">
        <h2>My Hobbies</h2>
        <div class="info-item">Cubing and walking</div>
        <div class="info-item">Watching and reading</div>
        <div class="info-item">Listening to music</div>
    </div>

    <div class="card">
        <h2>My Favorite Interest</h2>
        <img src="https://i.pinimg.com/736x/83/46/15/83461550951eac0cf0412680e3e4da74.jpg" alt="My favorite interest" width="250">
    </div>

    <div class="card">
        <h2>Contact Me</h2>
        <form class="contact-form" action="#" method="post" aria-label="Contact form">
        <div class="form-field">
            <label for="name"> Full Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send message</button>
        </form>
    </div>
</body>
</html>
